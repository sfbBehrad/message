name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Find and Build with Gradle
      run: |
        # جستجوی خودکار برای یافتن فایل gradlew در تمام پوشه‌ها
        GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -z "$GRADLE_PATH" ]; then
          echo "Error: gradlew not found! Please make sure you uploaded all files correctly."
          exit 1
        fi
        GRADLE_DIR=$(dirname "$GRADLE_PATH")
        echo "Found gradlew in $GRADLE_DIR"
        
        # ورود به پوشه، دادن دسترسی و ساخت APK
        cd "$GRADLE_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: secure-chat-apk
        path: "**/app/build/outputs/apk/debug/app-debug.apk"
