name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with global Gradle
      run: |
        # جستجو برای پیدا کردن پوشه اصلی تنظیمات پروژه
        PROJECT_DIR=$(find . -name "settings.gradle*" | head -n 1)
        if [ -z "$PROJECT_DIR" ]; then
          echo "Error: settings.gradle not found! The project structure might be incomplete."
          exit 1
        fi
        
        # ورود به پوشه و بیلد با گریدلِ خود سرور
        cd $(dirname "$PROJECT_DIR")
        gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: secure-chat-apk
        path: "**/build/outputs/apk/debug/*.apk"
